[project]
name = "fastapi-best-practices-app"
version = "0.1.0"
description = "Reference FastAPI application following the fastapi-best-practices ruleset"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "bcrypt>=4.1",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "pycasbin>=2.8.0",
    "casbin-async-sqlalchemy-adapter>=1.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "ASYNC",
]
ignore = [
    "B008", # FastAPI Depends() in defaults is the documented legacy style; we use Annotated
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:src.*"]

[tool.uv]
package = true
